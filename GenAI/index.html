<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AWS Generative AI Developer — Practice Exam</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">☁︎</span>
      <div>
        <h1>AWS Generative AI Developer</h1>
        <p class="subtitle">Practice Exam · 300 questions</p>
      </div>
    </div>
    <div class="stats" id="stats">
      <div class="stat"><span class="stat-num" id="stat-answered">0</span><span class="stat-label">Answered</span></div>
      <div class="stat"><span class="stat-num" id="stat-correct">0</span><span class="stat-label">Correct</span></div>
      <div class="stat"><span class="stat-num" id="stat-accuracy">—</span><span class="stat-label">Accuracy</span></div>
    </div>
  </header>

  <div class="toolbar">
    <label>Category
      <select id="category-filter"></select>
    </label>
    <label>Mode
      <select id="mode-select">
        <option value="practice">Practice (instant feedback)</option>
        <option value="exam">Exam (reveal at end)</option>
      </select>
    </label>
    <button id="shuffle-btn" class="btn ghost">⤮ Shuffle</button>
    <button id="reset-btn" class="btn ghost">↺ Reset progress</button>
    <div class="spacer"></div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="progress-text" id="progress-text">0 / 0</span>
    </div>
  </div>

  <main id="main">
    <section class="card" id="question-card">
      <div class="card-head">
        <span class="badge" id="q-category">—</span>
        <span class="q-index" id="q-index">Question 0 of 0</span>
      </div>
      <h2 class="q-text" id="q-text">Loading questions…</h2>
      <p class="q-hint" id="q-hint"></p>
      <form id="options-form" class="options"></form>
      <div class="feedback" id="feedback" hidden></div>
      <div class="actions">
        <button class="btn" id="prev-btn">← Previous</button>
        <button class="btn primary" id="check-btn">Check answer</button>
        <button class="btn" id="next-btn">Next →</button>
      </div>
    </section>

    <aside class="card grid-card">
      <h3>Question navigator</h3>
      <div class="grid" id="nav-grid"></div>
      <div class="legend">
        <span><i class="dot correct"></i> correct</span>
        <span><i class="dot wrong"></i> wrong</span>
        <span><i class="dot current"></i> current</span>
        <span><i class="dot unseen"></i> unseen</span>
      </div>
    </aside>
  </main>

  <div class="exam-result card" id="exam-result" hidden></div>

  <footer class="foot">
    <span id="foot-status">Loading…</span>
    <span>Local practice tool · not affiliated with Amazon Web Services</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
